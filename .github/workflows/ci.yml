name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version-file: pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # The strict sandbox is the Linux default; these are its declared system
      # dependencies, and verify.sh refuses to run without them.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap util-linux
      - run: uv sync
      # Build a system that restricts unprivileged user namespaces on purpose,
      # whatever the image's defaults: switch AppArmor's restriction on, and run
      # a copy of bwrap from a path no AppArmor profile attaches to (profiles
      # attach by path). The strict sandbox must then refuse to start and name
      # AppArmor as the cause. The copy is on PATH for the check only, and the
      # switch goes back to 0 when the step exits. A kernel without a usable
      # switch skips the check with a notice. The first group logs what the image
      # provides, so a change in its defaults can be diagnosed.
      - name: Strict sandbox refuses to start where user namespaces are restricted
        run: |
          switch=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          echo "::group::What this runner provides"
          echo "system: $(lsb_release -ds 2>/dev/null || echo unknown), kernel $(uname -r)"
          dpkg-query -W bubblewrap apparmor apparmor-profiles 2>/dev/null || true
          echo "kernel.apparmor_restrict_unprivileged_userns: $(cat "$switch" 2>&1 || true)"
          echo "loaded AppArmor profiles for bwrap or unprivileged user namespaces:"
          sudo -n aa-status 2>&1 | grep -i -E 'bwrap|unprivileged_userns' || echo "  none (or aa-status is unavailable)"
          echo "AppArmor profile files that mention bwrap:"
          grep -ril bwrap /etc/apparmor.d 2>/dev/null || echo "  none"
          if bwrap --ro-bind / / --unshare-all -- true 2> "$RUNNER_TEMP/bwrap-probe.txt"; then
            echo "$(command -v bwrap) starts as the image is configured"
          else
            echo "$(command -v bwrap) fails as the image is configured: $(cat "$RUNNER_TEMP/bwrap-probe.txt")"
          fi
          echo "::endgroup::"
          if ! cat "$switch" > /dev/null 2>&1; then
            echo "::notice title=Sandbox refusal check skipped::this kernel has no usable kernel.apparmor_restrict_unprivileged_userns, so the restriction cannot be built"
            exit 0
          fi
          unprofiled="$RUNNER_TEMP/unprofiled-bwrap"
          trap 'sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; rm -rf "$unprofiled"' EXIT
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          mkdir -p "$unprofiled"
          install -m 0755 "$(command -v bwrap)" "$unprofiled/bwrap"
          PATH="$unprofiled:$PATH" SUPER_AGENT_TEST_EXPECT_SANDBOX_REFUSAL=1 \
            uv run pytest tests/tools/test_isolation.py -k test_strict_sandbox_startup_trial_matches_this_kernel
      # Ubuntu 24.04 confines unprivileged user namespaces with AppArmor, which
      # stops bwrap from configuring loopback in its network namespace. Lift the
      # restriction where the kernel has it, so the strict sandbox tests run.
      - run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: npm ci
      - run: npm run build:web
      - run: git diff --exit-code -- super_agent/web/static/app.js
      # With the restriction lifted, a strict sandbox test that still cannot run
      # fails here instead of skipping.
      - run: ./scripts/verify.sh
        env:
          SUPER_AGENT_TEST_REQUIRE_SANDBOX: "1"
      # Metrics are reported, never gated: this step fails only when the script
      # cannot measure. It reads the coverage data verify.sh just wrote, so the
      # suite does not run a second time.
      - run: >-
          uv run python scripts/metrics.py --collect-tests --coverage-file .coverage --cold-start-runs 20
          --json "$RUNNER_TEMP/metrics.json" --markdown "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: metrics
          path: ${{ runner.temp }}/metrics.json
          if-no-files-found: error
